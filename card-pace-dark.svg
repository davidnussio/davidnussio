<svg xmlns="http://www.w3.org/2000/svg" width="276" height="230" viewBox="0 -3 276 230" role="img" aria-label="Pace: Running pace calculator">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171c24"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316" stop-opacity=".75"/><stop offset=".35" stop-color="#30363d"/><stop offset="1" stop-color="#30363d"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(246 -10) scale(152 190)"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="276" height="224" rx="16"/></clipPath>
</defs>
<style>
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 175.469px 35.5px; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.6); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
<g clip-path="url(#clip)">
  <rect width="276" height="224" fill="url(#bg)"/>
  <rect width="276" height="224" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="275" height="223" rx="15.5" fill="none" stroke="url(#edge)"/>
<rect x="22" y="22" width="44" height="44" rx="12" fill="url(#accent)"/>
<g transform="translate(32 32)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="7"/><path d="M12 14V10M10 3h4M12 3v4M18.4 7.6l1.2-1.2"/></g>
<text x="80" y="41" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Pace</text>
<text x="80" y="59" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing=".4" fill="#7d8590">ANDROID · WEAR OS</text>
<circle class="pulse" cx="175.5" cy="35.5" r="3.5" fill="#d29922"/>
<circle cx="175.5" cy="35.5" r="3.5" fill="#d29922"/>
<text x="254" y="39" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#d29922">coming soon</text>
<text x="22" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1">Running pace for the track: rep tables</text>
<text x="22" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1">from 100 m to the marathon, splits</text>
<text x="22" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1">every 400 m and training paces from a</text>
<text x="22" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1">recent race. Offline, no account.</text>
<rect x="22" y="180" width="53.9" height="22" rx="11" fill="#21262d"/><text x="30.0" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#c9d1d9">Kotlin</text>
<text x="254" y="195" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#f0f6fc">1.0 RC</text>
</svg>
