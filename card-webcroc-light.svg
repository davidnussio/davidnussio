<text x="80" y="59" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing=".4" fill="#6e7781">WEB APP · PEER TO PEER</text>
