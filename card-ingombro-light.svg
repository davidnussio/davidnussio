<svg xmlns="http://www.w3.org/2000/svg" width="276" height="230" viewBox="0 -3 276 230" role="img" aria-label="Ingombro: Disk space analyzer for macOS">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4" stop-opacity=".75"/><stop offset=".35" stop-color="#d1d9e0"/><stop offset="1" stop-color="#d1d9e0"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(246 -10) scale(152 190)"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.13"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="276" height="224" rx="16"/></clipPath>
</defs>
<style>
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 207.074px 35.5px; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.6); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
<g clip-path="url(#clip)">
  <rect width="276" height="224" fill="url(#bg)"/>
  <rect width="276" height="224" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="275" height="223" rx="15.5" fill="none" stroke="url(#edge)"/>
<rect x="22" y="22" width="44" height="44" rx="12" fill="url(#accent)"/>
