  <radialGradient id="dglow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(246 -10) scale(152 190)"><stop offset="0" stop-color="#f97316" stop-opacity="0.2"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
