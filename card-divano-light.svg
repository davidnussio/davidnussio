  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(388 -10) scale(230 190)"><stop offset="0" stop-color="#d946ef" stop-opacity="0.13"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient>
